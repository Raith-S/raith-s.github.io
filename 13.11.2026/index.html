<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Story Generator</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <p class="subtitle">A small JavaScript project</p>
    <h1>Story Generator</h1>
    <p>Pick a name. Let chance write the adventure.</p>
 
    <label for="Bankkonto">Your character's name</label>
    <input id="Höhe der Einzahlung" type="text" placeholder="€" maxlength="60">
    <button id="generate" type="button">Generate story</button>
 
    <p id="story" aria-live="polite">Your story will appear here.</p>
  </main>
</body>
</html>
